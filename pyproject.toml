[project]
name = "radar-alerts"
version = "0.1.0"
description = "Subscriptions and alert rules for the gamedev-trends radar: Django + DRF API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18",
    "django-stubs-ext>=6.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1",
    "djangorestframework-stubs[compatible-mypy]>=3.18",
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_alerts"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "manage.py"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "radar_alerts.settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "radar_alerts.settings"
markers = ["postgres: needs PostgreSQL; skipped on SQLite"]
