x-app: &app
  build: .
  image: radar-alerts:local
  env_file: .env
  restart: unless-stopped

x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  DJANGO_DEBUG: ""

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_alerts}
      POSTGRES_USER: ${POSTGRES_USER:-radar_alerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-radar_alerts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: >-
      celery -A radar_alerts worker -l info -n worker@%h
      --concurrency ${WORKER_CONCURRENCY:-2}
    environment:
      <<: *app-env
      CLICKHOUSE_URL: ${DOCKER_CLICKHOUSE_URL:-http://clickhouse:8123}
    networks: [default, radar]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A radar_alerts inspect ping -d worker@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  beat:
    <<: *app
    command: ["celery", "-A", "radar_alerts", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_healthy, restart: true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: localhost", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  radar:
    external: true
    name: ${RADAR_DOCKER_NETWORK:-gamedev-trends_default}

volumes:
  db-data:
  rabbitmq-data:
