name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run mypy
      - run: uv run pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: radar_alerts
          POSTGRES_USER: radar_alerts
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar_alerts -d radar_alerts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: radar_alerts
      POSTGRES_USER: radar_alerts
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.36.3
        env:
          CLICKHOUSE_USER: radar
          CLICKHOUSE_PASSWORD: ci-password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CLICKHOUSE_TEST_URL: http://localhost:8123
      CLICKHOUSE_TEST_USER: radar
      CLICKHOUSE_TEST_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m clickhouse

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env and the fake Telegram
        run: |
          cp .env.example .env
          sed -i -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-db-password/' \
                 -e 's/^RABBITMQ_PASSWORD=.*/RABBITMQ_PASSWORD=ci-mq-password/' \
                 -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-secret-key/' \
                 -e 's/^TELEGRAM_BOT_TOKEN=.*/TELEGRAM_BOT_TOKEN=123456:ci-fake-token/' \
                 -e 's#^TELEGRAM_API_URL=.*#TELEGRAM_API_URL=http://telegram-stub:8081#' .env
          docker network create gamedev-trends_default
          docker run -d --name telegram-stub --network gamedev-trends_default \
                 -v "$PWD/tests/telegram_stub.py:/stub.py:ro" python:3.14.7-slim-trixie python /stub.py
      - name: Bring the stack up
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Check web, static and users
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/admin/css/base.css
          test "$(docker compose exec -T web id -u)" != "0"
          test "$(docker compose exec -T worker id -u)" != "0"
          docker compose exec -T web python manage.py check
      - name: Check the logs for secrets
        run: |
          sleep 30  # beat queues 2-3 bot polls with the fake token
          docker compose logs --no-color > compose.log
          grep -q "polling Telegram failed" compose.log
          docker logs telegram-stub 2>&1 | grep -q "/getUpdates"
          ! grep -F -e ci-db-password -e ci-mq-password -e ci-secret-key -e ci-fake-token compose.log
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: |
          docker rm -f telegram-stub
          docker compose down -v
